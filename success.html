<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penguin Pay — Success</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="success.css" />
</head>
<body>
  <div class="background">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="success-page">
    <section class="success-card">
      <div class="logo-frame">
        <img src="assets/logo.png" alt="Penguin Pay logo" class="success-logo" />
      </div>
      <p class="brand-name">PENGUIN PAY</p>
      <p class="brand-tagline">TRUSTED PAYMENT PLATFORM IN INDIA</p>

      <h1 class="success-title">Success!</h1>
      <p class="success-message">Your verification has been submitted successfully.</p>

      <button type="button" class="btn-ok" id="okBtn">OK</button>
    </section>
  </main>

  <script src="success.js"></script>
</body>
</html>
