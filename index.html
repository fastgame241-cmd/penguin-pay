<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penguin Pay — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <div class="background">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <main class="login-card">
      <div class="brand">
        <img src="assets/logo.png" alt="Penguin Pay logo" class="logo" />
        <h1>Penguin Pay</h1>
        <p class="tagline">TRUSTED PAYMENT PLATFORM IN INDIA</p>
      </div>

      <form class="login-form" id="loginForm" novalidate>
        <div class="field">
          <label for="phone">Phone Number</label>
          <div class="input-wrapper">
            <span class="field-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
            </span>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="Enter phone number"
              autocomplete="tel"
              inputmode="numeric"
              maxlength="10"
              pattern="[0-9]{10}"
              required
            />
          </div>
          <p class="field-error hidden" id="phoneError">Phone number must be exactly 10 digits</p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrapper password-wrapper">
            <span class="field-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              minlength="6"
              required
            />
            <button type="button" class="toggle-password" aria-label="Show password">
              <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <p class="field-error hidden" id="passwordError">Password must be at least 6 characters</p>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" name="remember" />
          <span>Remember me</span>
        </label>

        <p class="form-status hidden" id="formStatus"></p>
        <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
      </form>

      <p class="signup-prompt">
        First visit creates your account. <a href="admin.html" class="link">Admin panel</a>
      </p>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Penguin Pay. All rights reserved.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
